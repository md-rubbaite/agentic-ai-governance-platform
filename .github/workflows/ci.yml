name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: agentgov check-policy src/agentgov/default_policy.toml

  demo:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Scripted end-to-end scenario (synthetic data)
        run: |
          agentgov demo | tee demo.txt
          {
            echo '### Governance demo (synthetic data)'
            echo '```'
            cat demo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t agentgov:ci .
      - name: Start, wait for health, call the API, verify the audit chain
        run: |
          KEY="ci_$(openssl rand -hex 24)"
          docker run -d --name ag -p 8080:8080 -e AGENTGOV_BOOTSTRAP_ADMIN_KEY="$KEY" --read-only --tmpfs /tmp -v agdata:/data agentgov:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl -fsS -H "x-api-key: $KEY" http://127.0.0.1:8080/v1/policy | grep -q '"default_effect":"deny"'
          curl -fsS -H "x-api-key: $KEY" http://127.0.0.1:8080/v1/audit/verify | grep -q '"valid":true'
          test "$(docker inspect -f '{{.Config.User}}' agentgov:ci)" = "10001"
      - if: always()
        run: docker logs ag || true
