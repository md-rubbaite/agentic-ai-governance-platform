<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Governance Console</title>
<style>
  :root{--bg:#060A13;--panel:#0E1729;--line:#22314F;--ink:#F5F7FB;--mute:#9FB0CC;--gold:#E2BD62;--ok:#7FE3B4;--warn:#FFB27A;--bad:#FF7A85}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(135deg,#060A13,#101A30);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:20px;letter-spacing:.2px}
  h1 span{color:var(--gold)}
  .eb{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:700;text-transform:uppercase}
  input,button,select{font:inherit;border-radius:10px;border:1px solid var(--line);background:#0B1322;color:var(--ink);padding:8px 12px}
  button{cursor:pointer;background:#13213C}
  button.primary{background:var(--gold);color:#0B1020;border-color:var(--gold);font-weight:700}
  button.danger{border-color:var(--bad);color:var(--bad)}
  nav{display:flex;gap:6px;padding:14px 28px;flex-wrap:wrap}
  nav button.active{border-color:var(--gold);color:var(--gold)}
  main{padding:8px 28px 40px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card .v{font-size:28px;font-weight:800}
  table{width:100%;table-layout:auto;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .allow{background:#123A27;color:var(--ok)} .deny{background:#3A1219;color:var(--bad)} .require_approval{background:#4A2A12;color:var(--warn)}
  .muted{color:var(--mute)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{margin:12px 0;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:13px}
  code{color:var(--gold)}
  @media (max-width:700px){th:nth-child(n+5),td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<header>
  <div><div class="eb">Agentic AI Governance</div><h1>Agent <span>Governance</span> Console</h1></div>
  <div class="row">
    <input id="key" type="password" placeholder="API key (admin, reviewer or auditor)" size="34" autocomplete="off">
    <button class="primary" id="connect">Connect</button>
    <span id="who" class="muted"></span>
  </div>
</header>
<nav id="tabs"></nav>
<main id="view"><p class="muted">Enter an API key. With <code>agentgov seed</code> the keys of the synthetic demo organisation are in <code>.agentgov-demo-keys.json</code>.</p></main>
<script>
"use strict";
let KEY = "";
const tabs = ["Overview","Approvals","Decisions","Agents","Audit"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill = e => `<span class="pill ${esc(e)}">${esc(e)}</span>`;
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"x-api-key": KEY, "content-type": "application/json", ...(opts.headers || {})}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || ("HTTP " + r.status));
  return body;
}
function nav(active) {
  document.getElementById("tabs").innerHTML = tabs.map(t => `<button class="${t===active?"active":""}" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.t));
}
const V = h => document.getElementById("view").innerHTML = h;
async function show(tab) {
  nav(tab);
  try {
    if (tab === "Overview") {
      const o = await api("/v1/overview");
      V(`<div class="note">Figures come from the connected control plane. In the demo they describe a synthetic organisation.</div>
      <div class="cards">
        <div class="card"><div class="muted">Allowed</div><div class="v">${o.decisions.allow||0}</div></div>
        <div class="card"><div class="muted">Denied</div><div class="v">${o.decisions.deny||0}</div></div>
        <div class="card"><div class="muted">Waiting for a human</div><div class="v">${o.approvals_pending}</div></div>
        <div class="card"><div class="muted">Agents (suspended)</div><div class="v">${o.agents} <span class="muted">(${o.agents_suspended})</span></div></div>
        <div class="card"><div class="muted">Audit entries</div><div class="v">${o.audit_entries}</div></div>
        <div class="card"><div class="muted">Active policy</div><div class="v" style="font-size:18px">${esc(o.policy_version)}</div></div>
      </div>`);
    } else if (tab === "Approvals") {
      const list = await api("/v1/approvals?status=pending");
      V(list.length ? `<table><tr><th>Agent</th><th>Request</th><th>Risk</th><th>Why</th><th>Votes</th><th>Expires</th><th></th></tr>${list.map(a => `
        <tr><td>${esc(a.agent_id)}</td><td>${esc(a.decision.tool)} · ${esc(a.decision.action)}${a.decision.amount!=null?" · "+esc(a.decision.amount):""}<div class="muted">${esc(JSON.stringify(a.decision.arguments_redacted))}</div></td>
        <td>${esc(a.decision.risk.score)} ${esc(a.decision.risk.tier)}</td><td>${esc(a.decision.matched_rule)}</td>
        <td>${a.votes.filter(v=>v.verdict==="approve").length}/${a.required_approvals} (${esc(a.required_role)})</td><td class="muted">${esc(a.expires_at)}</td>
        <td><div class="row"><input id="c-${esc(a.id)}" placeholder="comment (required)" size="16"><button class="primary" data-v="approve" data-id="${esc(a.id)}">Approve</button><button class="danger" data-v="reject" data-id="${esc(a.id)}">Reject</button></div></td></tr>`).join("")}</table>`
        : `<p class="muted">No approvals waiting.</p>`);
      document.querySelectorAll("button[data-v]").forEach(b => b.onclick = async () => {
        const comment = document.getElementById("c-" + b.dataset.id).value;
        try { await api(`/v1/approvals/${b.dataset.id}/vote`, {method:"POST", body: JSON.stringify({verdict: b.dataset.v, comment})}); show("Approvals"); }
        catch (e) { alert(e.message); }
      });
    } else if (tab === "Decisions") {
      const list = await api("/v1/decisions?limit=100");
      V(`<table><tr><th>When</th><th>Agent</th><th>Tool · action</th><th>Effect</th><th>Risk</th><th>Rule / reason</th></tr>${list.map(d => `
        <tr><td class="muted">${esc(d.created_at)}</td><td>${esc(d.agent_id)}</td><td>${esc(d.tool)} · ${esc(d.action)}</td><td>${pill(d.effect)}<div class="muted">${esc(d.status)}</div></td>
        <td>${esc(d.risk.score)} ${esc(d.risk.tier)}</td><td>${esc(d.matched_rule || d.reasons[0])}</td></tr>`).join("")}</table>`);
    } else if (tab === "Agents") {
      const list = await api("/v1/agents");
      V(`<table><tr><th>Agent</th><th>Owner</th><th>Autonomy</th><th>EU AI Act</th><th>Tools</th><th>Status</th><th></th></tr>${list.map(a => `
        <tr><td><b>${esc(a.name)}</b><div class="muted">${esc(a.id)}</div></td><td>${esc(a.owner)}</td><td>${esc(a.autonomy)}</td><td>${esc(a.eu_ai_act_risk)}</td>
        <td class="muted">${a.allowed_tools.map(esc).join("<br>")}</td><td>${pill(a.status==="active"?"allow":"deny")} ${esc(a.status)}</td>
        <td>${a.status==="active" ? `<button class="danger" data-s="${esc(a.id)}">Suspend</button>` : ""}</td></tr>`).join("")}</table>`);
      document.querySelectorAll("button[data-s]").forEach(b => b.onclick = async () => {
        const reason = prompt("Reason for suspending " + b.dataset.s);
        if (!reason) return;
        try { await api(`/v1/agents/${b.dataset.s}/suspend`, {method:"POST", body: JSON.stringify({reason})}); show("Agents"); } catch (e) { alert(e.message); }
      });
    } else if (tab === "Audit") {
      const [v, list] = await Promise.all([api("/v1/audit/verify").catch(e => ({error: e.message})), api("/v1/audit?limit=200")]);
      V(`<div class="note">Hash chain: ${v.error ? esc(v.error) : v.valid ? `<b style="color:var(--ok)">valid</b> · ${v.entries} entries · head <code>${esc(v.head.slice(0,16))}…</code>` : `<b style="color:var(--bad)">INVALID</b> from entry #${esc(v.first_invalid_seq)}`}</div>
      <table><tr><th>#</th><th>When</th><th>Actor</th><th>Event</th><th>Subject</th><th>Hash</th></tr>${list.map(e => `
        <tr><td>${e.seq}</td><td class="muted">${esc(e.ts)}</td><td>${esc(e.actor)}</td><td>${esc(e.event)}</td><td class="muted">${esc(e.subject)}</td><td><code>${esc(e.hash.slice(0,12))}</code></td></tr>`).join("")}</table>`);
    }
  } catch (e) { V(`<p style="color:var(--bad)">${esc(e.message)}</p>`); }
}
document.getElementById("connect").onclick = async () => {
  KEY = document.getElementById("key").value.trim();
  try { const me = await api("/v1/whoami"); document.getElementById("who").textContent = `${me.name} · ${me.role}`; show("Overview"); }
  catch (e) { document.getElementById("who").textContent = e.message; }
};
</script>
</body>
</html>
