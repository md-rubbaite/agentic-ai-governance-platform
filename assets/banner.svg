<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Agentic AI Governance Platform: policy, approvals and audit for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A13"/><stop offset="1" stop-color="#121D35"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.4"><stop offset="0" stop-color="#E2BD62" stop-opacity="0.16"/><stop offset="1" stop-color="#E2BD62" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="64" y="70" width="44" height="5" rx="2.5" fill="#E2BD62"/>
    <text x="124" y="79" font-size="18" font-weight="800" letter-spacing="4" fill="#E2BD62">AGENTIC AI GOVERNANCE</text>
    <text x="62" y="150" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">Agents ask before</text>
    <text x="62" y="212" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">they act.</text>
    <text x="64" y="262" font-size="21" font-weight="600" fill="#C9D1E0">Policy · risk scoring · human approval · kill switch · tamper-evident audit</text>
    <text x="64" y="304" font-size="16" font-weight="600" fill="#8FA0BE">Python · FastAPI · SQLite · Docker · MIT</text>
  </g>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="840" y="62" width="380" height="236" rx="20" fill="#152039" stroke="#2C3A57" stroke-width="2"/>
    <text x="868" y="100" font-size="14" letter-spacing="3" fill="#E2BD62">DECISION</text>
    <rect x="868" y="118" width="324" height="44" rx="12" fill="#123A27"/><text x="886" y="146" fill="#7FE3B4">allow</text><text x="1176" y="146" text-anchor="end" fill="#C9D1E0" font-weight="600">read supplier · risk 15</text>
    <rect x="868" y="172" width="324" height="44" rx="12" fill="#4A2A12"/><text x="886" y="200" fill="#FFB27A">approval</text><text x="1176" y="200" text-anchor="end" fill="#C9D1E0" font-weight="600">pay 24,000 · 2 reviewers</text>
    <rect x="868" y="226" width="324" height="44" rx="12" fill="#3A1219"/><text x="886" y="254" fill="#FF7A85">deny</text><text x="1176" y="254" text-anchor="end" fill="#C9D1E0" font-weight="600">secret in arguments</text>
  </g>
</svg>
